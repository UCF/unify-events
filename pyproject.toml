[project]
name = "unify-events"
version = "2.7.0"
description = "UCF Events Calendar"
readme = "README.md"
# Production is pinned to Python 3.8 and cannot be upgraded at this time. The
# upper bound keeps a recompile on a newer interpreter from resolving past the
# versions production is able to install. Keep in sync with .python-version.
requires-python = ">=3.8,<3.9"
# Lower bounds, not pins: requirements.txt is the lock file and holds the exact
# versions. Where a bound has an upper limit, the comment says what imposes it.
# Most of these floors are the highest release that still supports Python 3.8.
dependencies = [
    # Framework.
    # Django is held at 3.2 LTS. 4.2 does still support Python 3.8, but it
    # removes django.conf.urls.url and django.utils.http.is_safe_url, both of
    # which every URLconf here and django-saml2-auth-ai 2.1.6 depend on.
    "django>=3.2.25,<3.3",
    "asgiref>=3.8.1",
    "sqlparse>=0.5.5",
    "pytz>=2026.3",
    "mysqlclient>=2.2.7",

    # Django apps.
    "django-appconf>=1.0.6",
    "django-bleach>=3.1.0",
    "django-compressor>=4.4",
    "django-taggit>=3.1.0,<4",  # 4.0 requires Django 4.1.
    "django-widget-tweaks>=1.5.0",
    "django-storages>=1.14.6",

    # Single sign-on.
    "pysaml2>=7.3.1",  # 7.5 requires Python 3.9.
    "django-saml2-auth-ai>=2.1.6",
    # django_saml2_auth imports pkg_resources at module scope, which no longer
    # ships with the interpreter. Without this the URLconf fails to import.
    "setuptools",
    "cryptography>=47.0.0",  # 50 requires Python 3.9.
    "pyopenssl>=26.2.0",  # 26.4 requires Python 3.9.

    # HTML handling.
    "bleach>=5.0.1",  # 6 requires django-bleach 4+, which requires Django 4.2.
    "beautifulsoup4>=4.15.0",
    "soupsieve>=2.7",
    # Retained so BeautifulSoup() keeps picking the same parser it does today;
    # bleach dropped its html5lib dependency in 5.0.
    "html5lib==1.1",
    "html2text>=2024.2.26",
    "webencodings>=0.5.1",

    # HTTP.
    "requests>=2.32.4",
    "certifi>=2026.7.22",
    "charset-normalizer>=3.4.9",
    "idna>=3.15",
    "urllib3>=1.26.20,<2",  # botocore forbids urllib3 2.x below Python 3.10.
    "boto3>=1.37.38",  # 1.37.x is the AWS SDK's last Python 3.8 release.
    "clearcache-python==0.0.8",

    # LDAP, backing events.auth.Backend when USE_SAML is off.
    "python-ldap>=3.4.7",
    "pyasn1>=0.6.4",
    "pyasn1-modules>=0.4.2",

    # Everything else.
    "gunicorn>=23.0.0",
    "pillow>=10.4.0",  # 11 requires Python 3.9.
    "packaging>=26.2",
    "python-dateutil>=2.9.0",
    "rcssmin>=1.1.1",
    "rjsmin>=1.2.1",
    "simplejson>=4.1.1",
    "six>=1.17.0",
    "unidecode>=1.4.0",
    "lorem==0.1.1",
]
